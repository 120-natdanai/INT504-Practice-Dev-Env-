<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INT504 IT-Bangmod Class Schedule Viewing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Class Schedule</h1>
    </header>

    <main>
        <dialog class="modal-container" id="modal">
            There is a problem. Please try again later.
        </dialog>

        <table data-testid="schedule-table">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Section</th>
                    <th>Group</th>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Weeks</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody id="tbody-schedule"></tbody>
        </table>
        <p id="empty-message" data-testid="empty-message">
            There is currently no class schedule. Please check back later.
        </p>
    </main>
    
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
